<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퉁공대 타이머</title>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const room = q.get('room') && /^[a-zA-Z0-9_-]{3,48}$/.test(q.get('room')) ? q.get('room') : 'tongtongi';
  const base = location.pathname.replace(/[^/]+$/, '');
  const index = base + (base.endsWith('/') ? '' : '') + 'index.html';
  location.replace(index + '?room=' + encodeURIComponent(room) + '&openTimer=1');
})();
</script>
</head>
<body>
<p>장부로 이동 중…</p>
</body>
</html>
